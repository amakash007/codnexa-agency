<svg viewBox="0 0 400 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="200" fill="transparent"/>
  
  <!-- Code brackets symbol -->
  <g transform="translate(80, 50)">
    <!-- Left bracket -->
    <path d="M 0 10 L 20 0 L 20 30 L 0 40" stroke="#FFA500" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- Forward slash -->
    <line x1="35" y1="0" x2="50" y2="40" stroke="#FFD700" stroke-width="4" stroke-linecap="round"/>
    <!-- Right bracket -->
    <path d="M 70 10 L 50 0 L 50 30 L 70 40" stroke="#FFA500" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Swoosh orbit -->
  <path d="M 60 20 Q 140 0 160 60" stroke="#FFD700" stroke-width="6" fill="none" stroke-linecap="round"/>
  <circle cx="165" cy="65" r="8" fill="#FFD700"/>
  
  <!-- CODNEXA Text -->
  <text x="50" y="150" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#1F2937">
    <tspan fill="#E5E7EB">COD</tspan><tspan fill="#FFA500">NEXA</tspan>
  </text>
  
  <!-- Innovate tagline -->
  <text x="50" y="180" font-family="Arial, sans-serif" font-size="16" fill="#FFD700" letter-spacing="3">
    innovate.
  </text>
</svg>